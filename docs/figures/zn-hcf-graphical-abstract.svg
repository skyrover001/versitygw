<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Trigonal-Zn-HCF synthesis and selective cesium adsorption</title>
  <desc id="svg-desc">A left-to-right graphical abstract showing potassium ferrocyanide trihydrate and zinc acetate precursors, DMF-assisted synthesis, the Trigonal-Zn-HCF product, and a conceptual schematic of cesium adsorption with competing ions and potassium release. Four performance claims are reproduced from the supplied image.</desc>
