  <text x="865" y="313" font-size="10" font-weight="700" text-anchor="middle" fill="#fff">Zn</text>
  <text class="small" x="865" y="389" text-anchor="middle">Zn–N coordination number</text>
  <text x="865" y="412" text-anchor="middle" font-size="17" font-weight="700" fill="#28776f">3.8</text>
  <text class="small" x="865" y="434" text-anchor="middle">Zn–N bond length</text>
  <text x="865" y="457" text-anchor="middle" font-size="17" font-weight="700" fill="#28776f">1.90 Å</text>

  <rect x="958" y="205" width="125" height="196" rx="13" fill="#f1f8f8" stroke="#d6e9e8"/>
  <text x="1020" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#397d7b">EXAFS</text>
  <text x="1020" y="267" text-anchor="middle" font-size="12" fill="#60758a">Coord. no.</text>
  <text x="1020" y="287" text-anchor="middle" font-size="15" font-weight="700">5.9 → 3.8</text>
  <text x="1020" y="323" text-anchor="middle" font-size="12" fill="#60758a">Zn–N</text>
  <text x="1020" y="343" text-anchor="middle" font-size="15" font-weight="700">1.95 → 1.90 Å</text>
  <path d="M978 361h84" stroke="#d6e4e9"/>
  <text x="1020" y="383" text-anchor="middle" font-size="11" fill="#60758a">Space group R-3c</text>

  <rect x="462" y="479" width="616" height="72" rx="12" fill="#f7fafc"/>
  <text x="770" y="507" text-anchor="middle" font-size="14" font-weight="700">Phase-pure trigonal framework</text>
  <text class="small" x="770" y="531" text-anchor="middle">Shorter Zn–N bonds + tetrahedral geometry preserve vacancies and exchangeable K⁺</text>

  <path d="M1117 340h24" stroke="#54728b" stroke-width="2.5" marker-end="url(#arrow)"/>

