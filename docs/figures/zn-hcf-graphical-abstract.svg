      <path d="M0 0L10 5L0 10Z" fill="#55728e"/>
    </marker>
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c58a16"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7652a4"/>
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans", sans-serif; fill: #20354b; }
      .title { font-size: 27px; font-weight: 700; letter-spacing: -0.35px; }
      .subtitle { font-size: 14px; fill: #60758a; }
      .stage { font-size: 17px; font-weight: 700; }
      .step { font-size: 12px; font-weight: 700; fill: #fff; text-anchor: middle; }
      .body { font-size: 15px; }
      .small { font-size: 12px; fill: #60758a; }
      .formula { font-size: 19px; font-weight: 600; }
      .ion { font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .card { fill: #fff; stroke: #d9e3ec; stroke-width: 1.5; }
      .subcard { fill: #f7fafc; stroke: #e2eaf1; stroke-width: 1.2; }
      .callout { fill: #f8fbfd; stroke: #dbe6ee; stroke-width: 1.2; }
    </style>
  </defs>

