<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Coordination-geometry engineering for selective cesium adsorption by trigonal zinc hexacyanoferrate</title>
  <desc id="svg-desc">DMF-assisted room-temperature co-precipitation transforms cubic octahedral Zn coordination into phase-pure trigonal tetrahedral T-Zn-HCF. Shorter Zn–N bonds and retained vacancies support rigidity and chemical tolerance, while ellipsoidal cavities favor cesium over sodium, magnesium, and calcium. A potassium–cesium ion-exchange schematic and abstract-reported performance metrics are shown.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#54728b"/>
    </marker>
    <marker id="gold-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#bd8519"/>
    </marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7350a0"/>
    </marker>
    <style>
      text { font-family: Arial, "Noto Sans", sans-serif; fill: #20354b; }
      .title { font-size: 29px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #60758a; }
      .stage { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #60758a; }
      .formula { font-size: 17px; font-weight: 600; }
      .card { fill: #fff; stroke: #d9e3ec; stroke-width: 1.5; }
      .subcard { fill: #f7fafc; stroke: #e2eaf1; stroke-width: 1.2; }
      .ion { font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; }
      .metric-label { font-size: 12px; fill: #60758a; }
      .metric-value { font-size: 18px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1800" height="1000" fill="#fff"/>
  <text class="title" x="60" y="48">Coordination-geometry engineering unlocks selective Cs⁺ capture</text>
  <text class="subtitle" x="60" y="74">DMF-induced cubic → trigonal transformation couples framework rigidity, Cs⁺ selectivity, and high adsorption performance</text>

