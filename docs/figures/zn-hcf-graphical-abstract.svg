  <rect class="subcard" x="82" y="319" width="286" height="77" rx="12"/>
  <text class="formula" x="225" y="353" text-anchor="middle">
    Zn(CH<tspan baseline-shift="sub" font-size="12">3</tspan>COO)<tspan baseline-shift="sub" font-size="12">2</tspan>
  </text>
  <text class="small" x="225" y="376" text-anchor="middle">Zinc acetate</text>
  <path d="M190 428h30v17l23 66c4 12-4 21-16 21h-44c-12 0-20-9-16-21l23-66z" fill="#fff" stroke="#52799b" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M180 489h51l9 24c2 7-3 12-10 12h-49c-7 0-12-5-10-12z" fill="#cce8ee"/>
